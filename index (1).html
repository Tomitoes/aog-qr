<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>AOG Daet - QR Scanner</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: #0f172a; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100%;
  }
  #wrap { max-width: 480px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 15px; text-align: center; margin: 0 0 12px; color: #f7e7b6; }
  .video-wrap {
    position: relative; width: 100%; border-radius: 12px; overflow: hidden;
    background: #000; border: 2px solid #d4a017;
  }
  video { width: 100%; display: block; max-height: 70vh; object-fit: cover; }
  .frame { position: absolute; inset: 12%; border: 2px solid #d4a017; border-radius: 10px; pointer-events: none; }
  .hint { text-align: center; font-size: 12px; color: #cbd5e1; margin: 12px 0; }
  .status { text-align: center; font-size: 13px; font-weight: 700; padding: 10px; border-radius: 10px; margin-top: 10px; }
  .status.ok { background: #14532d; color: #bbf7d0; }
  .status.err { background: #7f1d1d; color: #fecaca; }
  button {
    display: block; width: 100%; padding: 12px; margin-top: 12px;
    background: #1e3a8a; color: #fff; border: none; border-radius: 10px;
    font-weight: 700; font-size: 14px;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div id="wrap">
    <h1>AOG Daet - Attendance Scanner</h1>
    <div class="video-wrap">
      <video id="video" autoplay playsinline muted></video>
      <div class="frame"></div>
    </div>
    <canvas id="canvas" class="hidden"></canvas>
    <div class="hint">Point the camera at a member's QR code. Keep this window open to keep scanning.</div>
    <div id="statusMsg" class="status hidden"></div>
    <button id="startBtn">Start Camera</button>
  </div>

<script>
(function () {
  'use strict';

  var video = document.getElementById('video');
  var canvas = document.getElementById('canvas');
  var ctx = canvas.getContext('2d', { willReadFrequently: true });
  var statusMsg = document.getElementById('statusMsg');
  var startBtn = document.getElementById('startBtn');

  var lastCode = null;
  var lastCodeTime = 0;
  var lastFrameTime = 0;
  var active = false;

  function showStatus(text, ok) {
    statusMsg.textContent = text;
    statusMsg.className = 'status ' + (ok ? 'ok' : 'err');
    statusMsg.classList.remove('hidden');
  }

  function startCamera() {
    if (typeof jsQR === 'undefined') {
      showStatus('QR scanning library failed to load. Check your internet connection and reload this page.', false);
      return;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showStatus('Camera not supported on this browser.', false);
      return;
    }
    navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } } })
      .catch(function () { return navigator.mediaDevices.getUserMedia({ video: true }); })
      .then(function (stream) {
        video.srcObject = stream;
        return video.play();
      })
      .then(function () {
        active = true;
        startBtn.classList.add('hidden');
        showStatus('Scanning...', true);
        requestAnimationFrame(scanLoop);
      })
      .catch(function (err) {
        showStatus('Camera error: ' + (err && (err.message || err.name) || 'unknown'), false);
      });
  }

  function scanLoop() {
    if (!active) return;
    requestAnimationFrame(scanLoop);

    var now = Date.now();
    if (now - lastFrameTime < 200) return;
    lastFrameTime = now;

    if (video.readyState !== video.HAVE_ENOUGH_DATA || !video.videoWidth) return;

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    var imageData, code;
    try {
      imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      code = jsQR(imageData.data, imageData.width, imageData.height);
    } catch (e) {
      showStatus('Scan error: ' + e.message, false);
      return;
    }

    if (!code || !code.data) {
      if (statusMsg.textContent !== 'Scanning...' && statusMsg.className.indexOf('ok') !== -1) {
        // leave the last successful scan message visible briefly instead of flickering
      }
      return;
    }

    if (code.data === lastCode && (now - lastCodeTime) < 3000) return;
    lastCode = code.data;
    lastCodeTime = now;

    showStatus('Scanned: ' + code.data, true);

    if (window.opener) {
      // Sends only the scanned ID string back to the AOG Daet app.
      window.opener.postMessage({ type: 'aog-qr-scan', code: code.data }, '*');
    } else {
      showStatus('Scanned ' + code.data + ' but no opener window found - open this page via the app\'s "Open Camera Scanner" button.', false);
    }
  }

  startBtn.addEventListener('click', startCamera);
  // Try to start automatically; falls back to the button if the browser
  // requires an explicit tap before granting camera access.
  startCamera();
})();
</script>
</body>
</html>
