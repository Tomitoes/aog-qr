<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>AOG Daet - QR Scanner</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: linear-gradient(165deg, #e2eef1 0%, #eaf3ec 100%); color: #17355c;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100%;
  }
  #wrap { max-width: 480px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 15px; text-align: center; margin: 0 0 12px; color: #17355c; font-weight: 800; }
  .video-wrap {
    position: relative; width: 100%; border-radius: 18px; overflow: hidden;
    background: #000; box-shadow: 0 12px 32px rgba(23,53,92,0.15);
  }
  video { width: 100%; display: block; max-height: 70vh; object-fit: cover; }
  .frame { position: absolute; inset: 12%; border: 2px solid #2f7d4f; border-radius: 12px; pointer-events: none; }
  .hint { text-align: center; font-size: 12px; color: #6b7280; margin: 12px 0; }
  .status { text-align: center; font-size: 13px; font-weight: 700; padding: 10px; border-radius: 12px; margin-top: 10px; }
  .status.ok { background: #f0fdf4; color: #15803d; }
  .status.err { background: #fef2f2; color: #b91c1c; }
  .status.pending { background: #eef5f2; color: #2f7d4f; }
  button {
    display: block; width: 100%; padding: 14px; margin-top: 12px;
    background: #17355c; color: #fff; border: none; border-radius: 999px;
    font-weight: 700; font-size: 14px; box-shadow: 0 8px 20px rgba(23,53,92,0.2);
  }
  .hidden { display: none !important; }

  .att-card {
    margin-top: 14px; text-align: center;
    background: #ffffff;
    border-top: 3px solid #2f7d4f; border-radius: 18px; padding: 18px;
    color: #17355c;
    box-shadow: 0 3px 12px rgba(23,53,92,0.08);
  }
  .att-card img.photo, .att-card .photo-placeholder {
    width: 84px; height: 84px; border-radius: 50%; object-fit: cover;
    background: rgba(47,125,79,0.12); color: #2f7d4f; margin: 0 auto 10px;
    box-shadow: 0 0 0 2px #2f7d4f;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; font-weight: 700;
  }
  .att-card .name { font-size: 17px; font-weight: 800; color: #17355c; }
  .att-card .idrole { font-size: 12px; color: #6b7280; margin: 2px 0 8px; }
  .att-card .result-status {
    display: inline-block; padding: 6px 16px; border-radius: 999px;
    font-size: 13px; font-weight: 700;
  }
  .att-card .result-status.recorded { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
  .att-card .result-status.duplicate { background: #fff7ed; color: #c2660a; border: 1px solid #fed7aa; }
  .att-card .result-status.error { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
</style>
</head>
<body>
  <div id="wrap">
    <h1>AOG Daet - Attendance Scanner</h1>
    <div class="video-wrap">
      <video id="video" autoplay playsinline muted></video>
      <div class="frame"></div>
    </div>
    <canvas id="canvas" class="hidden"></canvas>
    <div class="hint">Point the camera at a member's QR code. The scanned member's info and attendance status will appear below.</div>
    <div id="statusMsg" class="status hidden"></div>
    <div id="attCard"></div>
    <button id="startBtn">Start Camera</button>
  </div>

<script>
(function () {
  'use strict';

  var video = document.getElementById('video');
  var canvas = document.getElementById('canvas');
  var ctx = canvas.getContext('2d', { willReadFrequently: true });
  var statusMsg = document.getElementById('statusMsg');
  var attCard = document.getElementById('attCard');
  var startBtn = document.getElementById('startBtn');

  var SCAN_COOLDOWN_MS = 1500; // required debounce between processed scans
  var lastScanTime = 0;
  var lastFrameTime = 0;
  var active = false;
  var awaitTimeoutId = null;

  function showStatus(text, kind) {
    statusMsg.textContent = text;
    statusMsg.className = 'status ' + kind; // 'ok' | 'err' | 'pending'
    statusMsg.classList.remove('hidden');
  }

  function hide(el) { el.classList.add('hidden'); }

  function getInitials(name) {
    var parts = (name || '').trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return '?';
    return (parts[0][0] + (parts[1] ? parts[1][0] : '')).toUpperCase();
  }

  function driveThumbnailUrl(driveUrl) {
    if (!driveUrl) return '';
    var match = String(driveUrl).match(/[-\w]{25,}/);
    if (!match) return '';
    return 'https://drive.google.com/thumbnail?id=' + match[0] + '&sz=w200';
  }

  function escapeHtml(str) {
    return String(str || '').replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // Renders the scanned member's card. This replaces whatever was shown
  // before, but only when a NEW result actually arrives - the previous
  // member's info stays on screen the whole time in between.
  function renderResult(res) {
    hide(statusMsg);
    if (!res || !res.success) {
      attCard.innerHTML = '<div class="att-card"><span class="result-status error">' +
        escapeHtml((res && res.message) || 'Invalid QR code.') + '</span></div>';
      return;
    }

    var m = res.member || {};
    var thumb = driveThumbnailUrl(m.image);
    var photoHtml = thumb
      ? '<img class="photo" src="' + thumb + '" onerror="this.outerHTML=\'<div class=&quot;photo-placeholder&quot;>' + getInitials(m.fullName) + '</div>\'">'
      : '<div class="photo-placeholder">' + getInitials(m.fullName) + '</div>';

    var statusClass = res.status === 'recorded' ? 'recorded' : 'duplicate';

    attCard.innerHTML =
      '<div class="att-card">' +
        photoHtml +
        '<div class="name">' + escapeHtml(m.fullName || '(no name)') + '</div>' +
        '<div class="idrole">ID: ' + escapeHtml(m.idNo || '') + (m.role ? ' • ' + escapeHtml(m.role) : '') + '</div>' +
        '<span class="result-status ' + statusClass + '">' + escapeHtml(res.message) + '</span>' +
      '</div>';
  }

  window.addEventListener('message', function (event) {
    if (!event.data || event.data.type !== 'aog-attendance-result') return;
    if (awaitTimeoutId) { clearTimeout(awaitTimeoutId); awaitTimeoutId = null; }
    renderResult(event.data.result);
  });

  function startCamera() {
    if (typeof jsQR === 'undefined') {
      showStatus('QR scanning library failed to load. Check your internet connection and reload this page.', 'err');
      return;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showStatus('Camera not supported on this browser.', 'err');
      return;
    }
    navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } } })
      .catch(function () { return navigator.mediaDevices.getUserMedia({ video: true }); })
      .then(function (stream) {
        video.srcObject = stream;
        return video.play();
      })
      .then(function () {
        active = true;
        startBtn.classList.add('hidden');
        showStatus('Scanning...', 'pending');
        requestAnimationFrame(scanLoop);
      })
      .catch(function (err) {
        showStatus('Camera error: ' + (err && (err.message || err.name) || 'unknown'), 'err');
      });
  }

  // Scanner stays open continuously - it is never stopped or restarted
  // between scans. Only the decode/send step is paused for SCAN_COOLDOWN_MS
  // after each successful scan, to prevent duplicate/accidental rapid scans.
  function scanLoop() {
    if (!active) return;
    requestAnimationFrame(scanLoop);

    var now = Date.now();
    if (now - lastFrameTime < 200) return; // ~5fps decode, keeps it lightweight
    lastFrameTime = now;

    if (now - lastScanTime < SCAN_COOLDOWN_MS) return; // 1.5s debounce window

    if (video.readyState !== video.HAVE_ENOUGH_DATA || !video.videoWidth) return;

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    var imageData, code;
    try {
      imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      code = jsQR(imageData.data, imageData.width, imageData.height);
    } catch (e) {
      showStatus('Scan error: ' + e.message, 'err');
      return;
    }

    if (!code || !code.data) return;

    lastScanTime = now;

    if (!window.opener) {
      showStatus('No connection to the AOG Daet app - open this page using its "Open Camera Scanner" button.', 'err');
      return;
    }

    showStatus('Checking attendance...', 'pending');
    // Sends only the scanned ID string back to the AOG Daet app, which looks
    // up the member and posts the full result back to this same window.
    // The previously displayed member card is left untouched until then.
    window.opener.postMessage({ type: 'aog-qr-scan', code: code.data }, '*');

    if (awaitTimeoutId) clearTimeout(awaitTimeoutId);
    awaitTimeoutId = setTimeout(function () {
      showStatus('No response from the app - check that its tab is still open, then try scanning again.', 'err');
    }, 8000);
  }

  startBtn.addEventListener('click', startCamera);
  // Try to start automatically; falls back to the button if the browser
  // requires an explicit tap before granting camera access.
  startCamera();
})();
</script>
</body>
</html>
